name: zizmor autofix (prototype)

on:
    push:
        branches: [main]
    workflow_dispatch:
  # schedule:
  #   - cron: "0 6 * * 1"   # weekly, enable after testing

permissions:
  contents: write
  pull-requests: write

jobs:
  autofix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false # push via explicit token instead (artipacked-clean)

      - name: Install zizmor v1.28.0
        run: |
          curl -fsSL https://github.com/zizmorcore/zizmor/releases/download/v1.28.0/zizmor-x86_64-unknown-linux-gnu.tar.gz \
             | tar -xz
             sudo mv zizmor /usr/local/bin/zizmor
             zizmor --version

      - name: Ensure PR labels exist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create safe-fix    --color 0e8a16 --description "zizmor safe autofix"   2>/dev/null || true
          gh label create needs-review --color d93f0b --description "zizmor unsafe autofix" 2>/dev/null || true

      - name: Scan → manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: zizmor --format=json . > "$RUNNER_TEMP/manifest.json" || true

      - name: Bucket + open PRs
        env:
          GH_TOKEN: ${{ secrets.ZIZMOR_PAT }}
          MANIFEST: ${{ runner.temp }}/manifest.json
        run: |
          pip install --quiet pyyaml
          python3 .github/workflows/scripts/zizmor_autofix.py